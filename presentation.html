*{box-sizing:border-box}body{margin:0;background:#0c242b;color:#173c47;font-family:system-ui,sans-serif;overflow:hidden}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #eabd72;outline-offset:4px}.stage{height:calc(100dvh - 76px);display:flex;align-items:center;justify-content:center;padding:22px}.slide{width:min(100%,calc((100dvh - 120px)*16/9));aspect-ratio:16/9;background:#f6f3eb;padding:5% 6%;position:relative;overflow:auto}.slide.dark{background:#10343f;color:white}h1{font-size:clamp(25px,3.6vw,55px);line-height:1.12;margin:0 0 5%;white-space:pre-line;letter-spacing:-1px}.content{display:grid;grid-template-columns:1fr;gap:26px}.split .content{grid-template-columns:1fr 1fr;gap:6%}.text{font-size:clamp(16px,2.1vw,32px);line-height:1.45;white-space:pre-line}.secondary{font-size:clamp(15px,1.7vw,26px);white-space:pre-line;line-height:1.5;margin-top:4%;color:#976425}.dark .secondary{color:#fff}.big .primary{font-size:clamp(22px,3vw,45px);color:#eabd72}.cover h1{font-size:clamp(40px,6vw,90px);margin-bottom:4%}.cover .primary{color:#eabd72}.cover .secondary{margin-top:6%}.split .secondary{margin:0;color:inherit;font-size:clamp(16px,2.1vw,32px)}footer{position:fixed;bottom:0;width:100%;height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 26px;color:#eee;gap:15px}footer a{color:#c3d2d2;text-decoration:none;font-size:14px}.controls{display:flex;align-items:center;gap:14px}button{background:transparent;border:1px solid #7b9399;color:white;padding:10px 18px;cursor:pointer;font-size:15px}button:disabled{opacity:.3;cursor:default}.count{font-size:14px;min-width:65px;text-align:center}.hint{font-size:12px;color:#aabec1}.progress{position:fixed;bottom:76px;height:3px;background:#eabd72;left:0;transition:width .15s}@media(max-width:650px){.stage{padding:8px}.slide{width:100%;height:calc(100dvh - 110px);aspect-ratio:auto;padding:30px 23px}.split .content{grid-template-columns:1fr;gap:25px}.text,.split .secondary{font-size:21px}h1{font-size:33px;margin-bottom:30px}.cover h1{font-size:50px}.secondary{margin-top:30px}.hint{display:none}footer{padding:12px}.controls{gap:6px}button{padding:10px}.count{min-width:49px}}@media(prefers-reduced-motion:reduce){.progress{transition:none}}
</style></head><body><main class="stage"><article id="slide" class="slide" aria-label="Presentation slide"><h1 id="title"></h1><div class="content"><div id="primary" class="text primary"></div><div id="secondary" class="secondary"></div></div></article></main><div class="progress" id="progress"></div><footer><a href="deliverables.html">← Deliverables</a><span class="hint">← → Navigate · F Fullscreen · Home / End</span><div class="controls"><button id="prev" aria-label="Previous slide">← Previous</button><span class="count" id="count" aria-live="polite"></span><button id="next" aria-label="Next slide">Next →</button><button id="full" aria-label="Toggle fullscreen">Fullscreen</button></div></footer><script>
const slides=[["How Machines\nLearn", "A practical introduction to AI and machine learning", "Kwaw Ebenezer\nAfrica Digital Skills Conference 2026", "cover"], ["Our starting question", "What does it mean for a machine to learn?", "Post one example of a prediction you encounter in daily life.", "big"], ["Our 90 minutes", "Welcome and starting point: 10 minutes\n\nAI concepts: 15 minutes\n\nTraining and prediction: 15 minutes", "Practical exercise: 20 minutes\n\nErrors and responsibility: 15 minutes\n\nApplications and questions: 15 minutes", "split"], ["AI and machine learning", "Artificial intelligence is the broad field.\n\nMachine learning is an approach within AI that learns patterns from data.", "Some AI systems use explicit rules.", "body"], ["Generative AI", "A model produces content such as text, images or audio.", "Learning approaches describe how a system learns.\nGenerative AI describes a kind of output.", "big"], ["The shop enquiry", "A clothing shop records enquiries and whether a purchase follows.", "Supervised learning uses examples with known labels.\n\nFeature: catalogue viewing time\nLabel: purchase within seven days", "split"], ["Similar market stalls", "Imagine grouping stalls by similarities without receiving category labels.", "Unsupervised learning finds patterns without target labels for the task.", "big"], ["A player learning a game", "An agent tries actions and receives rewards from an environment.", "Reinforcement learning seeks a strategy that improves cumulative reward.", "big"], ["Categories and quantities", "CLASSIFICATION\nPredict a category\n\nPurchase or no purchase\nSpam or legitimate email", "REGRESSION\nPredict a numerical quantity\n\nDelivery time in minutes\nWeekly sales in cedis", "split"], ["The building blocks", "FEATURE\nAn input used for prediction\n\nLABEL\nThe outcome to predict", "TRAINING\nLearning patterns from examples\n\nINFERENCE\nApplying the model to a new input", "split"], ["The model development process", "1. Define the outcome and prediction time\n\n2. Prepare relevant examples\n\n3. Train the model\n\n4. Evaluate on unseen examples\n\n5. Monitor performance in use", "A clear question comes before a complex model.", "body"], ["Training validation and testing", "Training data helps the model learn.\n\nValidation data helps choose settings.\n\nTest data supports final evaluation.", "Keep the final test independent of model selection.", "body"], ["Two ways evaluation can mislead", "OVERFITTING\nStrong training results can hide weak performance on new examples.", "DATA LEAKAGE\nInformation enters development that would not appropriately be available for prediction.", "split"], ["Your practical exercise", "A fictional shop in Agona Swedru", "Will an enquiry lead to a purchase within seven days?\n\nOpen the demonstration section of your handout.", "big"], ["Learning a simple pattern", "NO PURCHASE\nA: 1 minute\nB: 2 minutes\nC: 3 minutes", "PURCHASE\nD: 6 minutes\nE: 7 minutes\nF: 8 minutes", "split"], ["Our learned threshold", "Above 4.5 minutes: predict purchase\n\nAt or below 4.5 minutes: predict no purchase", "The threshold fits these six training examples.", "body"], ["Predictions on new examples", "G: 2 minutes, actual No\n\nH: 5 minutes, actual No", "I: 7 minutes, actual Yes\n\nJ: 4 minutes, actual Yes", "split"], ["Our test results", "2 correct predictions out of 4\n\nAccuracy: 50 percent", "H is a false positive.\nJ is a false negative.\n\nAlways predicting No also scores 50 percent here.", "big"], ["Accuracy does not tell the whole story", "100 fictional enquiries\n10 actual purchases\n\nAlways predict No: 90 percent accuracy", "The model finds none of the purchases.\n\nPrecision: how many predicted positives are correct?\nRecall: how many actual positives are found?", "split"], ["Data quality and bias", "Missing records and incorrect labels can distort learning.\n\nUnderrepresented groups may experience different errors.", "A dataset from urban online shoppers may not transfer well to rural customers.", "body"], ["Privacy and human oversight", "Use fictional data for practice.\n\nKeep confidential records out of unapproved tools.\n\nFollow organizational data handling requirements.\n\nAssign people to review consequential outputs.", "A fluent answer or model score needs appropriate evidence.", "body"], ["My review questions", "What does the model predict?\n\nWhich data taught it?\n\nHow does it perform on new examples?\n\nWho experiences the errors?\n\nWho reviews the result?", "These questions apply beyond the classroom.", "body"], ["Applications in our own work", "MARKETING\nUnderstanding enquiries and forecasting demand\n\nPUBLIC HEALTH\nExploring outreach attendance patterns", "SOFTWARE PROJECTS\nIdentifying a task that might benefit from prediction\n\nEVERYDAY SERVICES\nSpam filtering and recommendations", "split"], ["Your idea worksheet", "The problem I want to understand\u2026\n\nThe output I need\u2026\n\nThe data and permissions required\u2026\n\nAn error that would matter\u2026\n\nA simple baseline to compare\u2026", "Complete one idea in your handout.", "body"], ["Questions and next steps", "What will you explore next?", "Kwaw Ebenezer\nekwaw4545@gmail.com\ngithub.com/kwaw-ebn", "big"], ["Further learning", "Google: Introduction to Machine Learning\n\nGoogle: Machine Learning Crash Course\n\nscikit-learn: Common pitfalls", "Links and reading list are in the participant handout.", "body"]];let current=0;const el=id=>document.getElementById(id);function show(n){current=Math.max(0,Math.min(slides.length-1,n));const [t,a,b,type]=slides[current];el('title').textContent=t;el('primary').textContent=a;el('secondary').textContent=b;el('secondary').hidden=!b;el('slide').className='slide '+type+(['big','cover'].includes(type)?' dark':'');el('count').textContent=(current+1)+' / '+slides.length;el('prev').disabled=current===0;el('next').disabled=current===slides.length-1;el('progress').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#slide-'+(current+1));el('slide').scrollTop=0;}function full(){if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}else{document.documentElement.requestFullscreen().catch(()=>{el('full').textContent='Use browser fullscreen';});}}el('prev').onclick=()=>show(current-1);el('next').onclick=()=>show(current+1);el('full').onclick=full;document.addEventListener('fullscreenchange',()=>el('full').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen');document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}if(e.key==='Home'){e.preventDefault();show(0);}if(e.key==='End'){e.preventDefault();show(slides.length-1);}if(e.key.toLowerCase()==='f')full();});const match=location.hash.match(/^#slide-(\d+)$/);show(match?Number(match[1])-1:0);
</script></body></html>
